      <g><circle cx="292.0" cy="320.0" r="2.2" /><circle cx="285.0" cy="350.6" r="2.2" /><circle cx="265.1" cy="376.6" r="2.2" /><circle cx="235.2" cy="393.9" r="2.2" /><circle cx="200.0" cy="400.0" r="2.2" /><circle cx="164.8" cy="393.9" r="2.2" /><circle cx="134.9" cy="376.6" r="2.2" /><circle cx="115.0" cy="350.6" r="2.2" /><circle cx="108.0" cy="320.0" r="2.2" /><circle cx="115.0" cy="289.4" r="2.2" /><circle cx="134.9" cy="263.4" r="2.2" /><circle cx="164.8" cy="246.1" r="2.2" /><circle cx="200.0" cy="240.0" r="2.2" /><circle cx="235.2" cy="246.1" r="2.2" /><circle cx="265.1" cy="263.4" r="2.2" /><circle cx="285.0" cy="289.4" r="2.2" /></g>
