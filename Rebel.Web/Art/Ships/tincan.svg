<!-- Major Tom's capsule, the tin can far above the world, its hatch open so he can climb out. Original artwork, painted for Rebel Rebel. The site shows wwwroot/art/ships/tincan.webp, painted from this drawing by Art/Paint (ships.sh). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs />
  <g>
    <g class="rs-look-print">
      <!-- antenna and its light -->
