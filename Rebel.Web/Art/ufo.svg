<!-- A flying saucer, 1950s style: chrome hull, glass dome, running lights. Original artwork, painted for Rebel Rebel. The site shows wwwroot/art/ufo.webp, rendered from this file at 600 x 340. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 170" width="300" height="170">
  <defs>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7f8" />
      <stop offset="0.38" stop-color="#c5ccd4" />
      <stop offset="0.52" stop-color="#8a939e" />
      <stop offset="0.7" stop-color="#5d6570" />
      <stop offset="1" stop-color="#2e333a" />
    </linearGradient>
    <linearGradient id="hullSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0.35" />
      <stop offset="0.3" stop-color="#000" stop-opacity="0" />
      <stop offset="0.62" stop-color="#fff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#000" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4048" />
      <stop offset="1" stop-color="#14171b" />
    </linearGradient>
    <radialGradient id="dome" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#f2fdff" />
      <stop offset="0.25" stop-color="#b9ecf7" />
      <stop offset="0.6" stop-color="#4f9fbd" />
      <stop offset="0.9" stop-color="#1d4c66" />
      <stop offset="1" stop-color="#123246" />
    </radialGradient>
    <radialGradient id="belly" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e9fff6" stop-opacity="0.95" />
      <stop offset="0.35" stop-color="#8ef0d0" stop-opacity="0.55" />
      <stop offset="1" stop-color="#8ef0d0" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe8" />
      <stop offset="0.4" stop-color="currentColor" />
      <stop offset="1" stop-color="currentColor" stop-opacity="0" />
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0.14 0.93  0 0 0 0.14 0.93  0 0 0 0.14 0.93  0 0 0 0 1" result="grain" />
      <feComposite in="SourceGraphic" in2="grain" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="g" />
      <feComposite in="g" in2="SourceAlpha" operator="in" />
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>
  <!-- the glow under the hull -->
  <ellipse cx="150" cy="124" rx="78" ry="20" fill="url(#belly)" />
  <g filter="url(#grain)">
    <!-- underside -->
    <path d="M28 94 C70 128 230 128 272 94 C230 112 70 112 28 94Z" fill="url(#under)" />
    <ellipse cx="150" cy="114" rx="34" ry="6" fill="#bff8e6" opacity="0.85" />
    <!-- the hull -->
    <ellipse cx="150" cy="92" rx="124" ry="25" fill="url(#hull)" />
    <ellipse cx="150" cy="92" rx="124" ry="25" fill="url(#hullSide)" />
    <path d="M40 86 C90 74 210 74 260 86 C210 80 90 80 40 86Z" fill="#fff" opacity="0.55" />
    <ellipse cx="150" cy="97" rx="116" ry="15" fill="none" stroke="#262b31" stroke-width="1.6" opacity="0.55" />
    <!-- the dome -->
    <ellipse cx="150" cy="80" rx="58" ry="9" fill="#4a535d" />
    <path d="M94 80 C96 40 122 26 150 26 C178 26 204 40 206 80 C180 88 120 88 94 80Z" fill="url(#dome)" />
    <path d="M112 66 C114 46 128 36 146 34 C130 42 122 52 120 68Z" fill="#fff" opacity="0.7" />
    <path d="M188 74 C190 62 186 50 178 42 C190 50 196 62 194 74Z" fill="#fff" opacity="0.25" />
  </g>
  <!-- running lights -->
  <g filter="url(#soft)" opacity="0.9">
    <circle cx="58" cy="100" r="7" fill="#ffc94a" />
    <circle cx="98" cy="106" r="7" fill="#7ff0ff" />
    <circle cx="150" cy="108" r="7" fill="#ff5a3c" />
    <circle cx="202" cy="106" r="7" fill="#7ff0ff" />
    <circle cx="242" cy="100" r="7" fill="#ffc94a" />
  </g>
  <g>
    <circle cx="58" cy="100" r="2.6" fill="#fffbe8" />
    <circle cx="98" cy="106" r="2.6" fill="#f2feff" />
    <circle cx="150" cy="108" r="2.6" fill="#fff1ea" />
    <circle cx="202" cy="106" r="2.6" fill="#f2feff" />
    <circle cx="242" cy="100" r="2.6" fill="#fffbe8" />
  </g>
</svg>
