      <feComposite in="glossy" in2="SourceAlpha" operator="in" result="painted" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="shadowBlur" />
      <feOffset in="shadowBlur" dx="6" dy="10" result="shadowOffset" />
      <feFlood flood-color="#140806" flood-opacity="0.5" result="shadowColour" />
      <feComposite in="shadowColour" in2="shadowOffset" operator="in" result="shadow" />
      <feComposite in="shadow" in2="SourceAlpha" operator="out" result="cast" />
      <feMerge>
        <feMergeNode in="cast" />
        <feMergeNode in="painted" />
      </feMerge>
    </filter>
    <filter id="rs-soft" x="-25%" y="-25%" width="150%" height="150%">
