<!-- The Blind Prophet, Blackstar and Lazarus, 2016: a bandage over the eyes with buttons sewn on. Original artwork, painted for Rebel Rebel. The site shows wwwroot/art/looks/prophet.webp, rendered from this file at 1000 x 1300. -->
