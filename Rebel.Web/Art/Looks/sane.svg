<!-- Aladdin Sane, 1973: eyes shut, the lightning bolt, the tear on the collarbone. Original artwork, painted for Rebel Rebel. The site shows wwwroot/art/looks/sane.webp, painted from this drawing by Art/Paint at 1000 x 1300. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <filter id="rs-volume" filterUnits="userSpaceOnUse" x="-60" y="-60" width="520" height="640" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="broad" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="tight" />
      <feComposite in="broad" in2="tight" operator="arithmetic" k1="0" k2="0.7" k3="0.3" k4="0" result="form" />
      <feTurbulence type="fractalNoise" baseFrequency="0.022 0.07" numOctaves="3" seed="4" result="strokes" />
      <feComposite in="form" in2="strokes" operator="arithmetic" k1="0" k2="1" k3="0.055" k4="-0.027" result="height" />
