      </feSpecularLighting>
      <feComposite in="sheen" in2="SourceAlpha" operator="in" result="sheenIn" />
      <feComposite in="lit" in2="sheenIn" operator="arithmetic" k1="0" k2="1" k3="0.3" k4="0" result="glossy" />
      <feComposite in="glossy" in2="SourceAlpha" operator="in" />
    </filter>
    <filter id="rs-soft" x="-25%" y="-25%" width="150%" height="150%">
