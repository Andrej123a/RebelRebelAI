<!-- Major Tom, 1969: the astronaut, the Earth and the sun in his gold visor, a bolt on the mission patch. Original artwork, painted for Rebel Rebel. The site shows wwwroot/art/looks/tom.webp, rendered from this file at 1000 x 1300. -->
