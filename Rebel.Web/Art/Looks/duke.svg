<!-- The Thin White Duke, 1976: slicked-back hair, white shirt, black waistcoat, a cigarette. Original artwork, painted for Rebel Rebel. The site shows wwwroot/art/looks/duke.webp, rendered from this file at 1000 x 1300. -->
