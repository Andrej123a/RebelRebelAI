<!-- Life on Mars?, 1971: the ice-blue suit, blue eyeshadow, shaggy red hair. Original artwork, painted for Rebel Rebel. The site shows wwwroot/art/looks/mars.webp, rendered from this file at 1000 x 1300. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520">
  <defs>
    <filter id="rs-volume" filterUnits="userSpaceOnUse" x="-60" y="-60" width="520" height="640" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="broad" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="tight" />
      <feComposite in="broad" in2="tight" operator="arithmetic" k1="0" k2="0.7" k3="0.3" k4="0" result="form" />
      <feTurbulence type="fractalNoise" baseFrequency="0.022 0.07" numOctaves="3" seed="4" result="strokes" />
      <feComposite in="form" in2="strokes" operator="arithmetic" k1="0" k2="1" k3="0.055" k4="-0.027" result="height" />
      <feDiffuseLighting in="height" surfaceScale="6" diffuseConstant="1.32" lighting-color="#fff2e2" result="key">
        <fePointLight x="-170" y="-150" z="500" />
      </feDiffuseLighting>
      <feDiffuseLighting in="height" surfaceScale="6" diffuseConstant="1.15" lighting-color="#ff9a5c" result="rim">
        <fePointLight x="640" y="300" z="24" />
      </feDiffuseLighting>
      <feComposite in="key" in2="rim" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" result="light" />
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="noise" />
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0.16 0.92  0 0 0 0.16 0.92  0 0 0 0.16 0.92  0 0 0 0 1" result="tooth" />
      <feComposite in="light" in2="tooth" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="shade" />
      <feComposite in="SourceGraphic" in2="shade" operator="arithmetic" k1="0.98" k2="0.04" k3="0" k4="0" result="lit" />
      <feSpecularLighting in="height" surfaceScale="6" specularConstant="0.55" specularExponent="18" lighting-color="#fff2e2" result="sheen">
        <fePointLight x="-170" y="-150" z="500" />
      </feSpecularLighting>
      <feComposite in="sheen" in2="SourceAlpha" operator="in" result="sheenIn" />
      <feComposite in="lit" in2="sheenIn" operator="arithmetic" k1="0" k2="1" k3="0.28" k4="0" result="glossy" />
      <feComposite in="glossy" in2="SourceAlpha" operator="in" result="painted" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="shadowBlur" />
      <feOffset in="shadowBlur" dx="6" dy="10" result="shadowOffset" />
      <feFlood flood-color="#140806" flood-opacity="0.5" result="shadowColour" />
      <feComposite in="shadowColour" in2="shadowOffset" operator="in" result="shadow" />
      <feComposite in="shadow" in2="SourceAlpha" operator="out" result="cast" />
      <feMerge>
        <feMergeNode in="cast" />
        <feMergeNode in="painted" />
      </feMerge>
    </filter>
    <filter id="rs-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="rs-pencil" x="-2%" y="-2%" width="104%" height="104%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="0.8" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.6" />
      </feComponentTransfer>
    </filter>
    <filter id="rs-cast" x="-10%" y="-10%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="11" result="mottle" />
      <feColorMatrix in="mottle" type="matrix" values="0 0 0 0.3 0.85  0 0 0 0.3 0.85  0 0 0 0.3 0.86  0 0 0 0 1" result="density" />
      <feComposite in="SourceGraphic" in2="density" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="mottled" />
      <feComposite in="mottled" in2="SourceAlpha" operator="in" result="figure" />
      <feDropShadow in="figure" dx="8" dy="16" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
    <pattern id="rs-dots" width="8" height="8" patternUnits="userSpaceOnUse">
