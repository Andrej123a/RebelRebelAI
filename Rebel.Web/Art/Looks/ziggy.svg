<!-- Ziggy Stardust, 1972: the striped Kansai Yamamoto jumpsuit with its bell legs, red platform boots, the gold sphere on the forehead. Original artwork, painted for Rebel Rebel. The site shows wwwroot/art/looks/ziggy.webp, rendered from this file at 1000 x 1300. -->
